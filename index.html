<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Link Hub - 短链接仓库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 680px;
            width: 100%;
            text-align: center;
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 28px;
            background: linear-gradient(135deg, #58a6ff, #a371f7);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo svg {
            width: 36px;
            height: 36px;
            fill: #fff;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .tagline {
            font-size: 16px;
            color: #8b949e;
            margin-bottom: 40px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px 28px;
            margin-bottom: 24px;
            text-align: left;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #58a6ff;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 16px;
        }

        .card p {
            font-size: 15px;
            color: #c9d1d9;
            margin-bottom: 10px;
        }

        .card p:last-child {
            margin-bottom: 0;
        }

        .tech-badge {
            display: inline-block;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 13px;
            color: #8b949e;
            margin: 4px 6px 4px 0;
        }

        .contact-section {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 32px;
        }

        .contact-label {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 8px;
        }

        .qq-number {
            font-size: 22px;
            font-weight: 700;
            color: #f0f6fc;
            letter-spacing: 1px;
            user-select: all;
        }

        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            padding: 8px 20px;
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: #2ea043;
        }

        .copy-btn:active {
            background: #1f6f2e;
        }

        .footer {
            font-size: 13px;
            color: #484f58;
        }

        .footer a {
            color: #58a6ff;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #238636;
            color: #fff;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            h1 { font-size: 24px; }
            .card { padding: 24px 20px; }
            .contact-section { padding: 24px 20px; }
            .qq-number { font-size: 19px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4a5 5 0 0 0 0-10z"/>
            </svg>
        </div>

        <h1>Short Link Hub</h1>
        <p class="tagline">简洁高效的短链接跳转服务</p>

        <!-- 项目说明卡片 -->
        <div class="card">
            <div class="card-title">📌 项目简介</div>
            <p>这是一个用于跳转超长链接的短链接仓库，将冗长复杂的 URL 转换为简短易记的链接，方便分享与传播。</p>
            <p style="margin-top: 14px;">
                <span class="tech-badge">🔗 链接缩短</span>
                <span class="tech-badge">↗️ 自动跳转</span>
                <span class="tech-badge">🛡️ 稳定可靠</span>
            </p>
        </div>

        <!-- 技术栈卡片 -->
        <div class="card">
            <div class="card-title">⚙️ 技术实现</div>
            <p>本项目基于 <strong style="color:#58a6ff;">GitHub</strong> 平台实现，利用 GitHub 仓库进行链接管理与托管，轻量、免费、无需服务器。</p>
            <p style="margin-top: 10px; font-size: 14px; color: #8b949e;">
                开源地址：<a href="https://github.com" style="color:#58a6ff; text-decoration:none;">github.com</a>
            </p>
        </div>

        <!-- 联系方式 -->
        <div class="contact-section">
            <div class="contact-label">📬 有需要请联系我</div>
            <div class="qq-number" id="qqText">QQ：2579610865</div>
            <button class="copy-btn" onclick="copyQQ()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                复制 QQ 号
            </button>
        </div>

        <div class="footer">
            <p>© 2026 Short Link Hub · Powered by GitHub</p>
        </div>
    </div>

    <!-- 复制成功提示 -->
    <div class="toast" id="toast">✅ 已复制 QQ 号到剪贴板</div>

    <script>
        function copyQQ() {
            const qq = '2579610865';
            navigator.clipboard.writeText(qq).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }).catch(() => {
                // fallback
                const textarea = document.createElement('textarea');
                textarea.value = qq;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            });
        }
    </script>

</body>
</html>
