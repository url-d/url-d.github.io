<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面跳转中...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 60px 50px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-width: 480px;
            width: 90%;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 30px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: #fff;
            color: #667eea;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            background: #f0f0f0;
        }

        .countdown {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-top: 20px;
        }

        .countdown span {
            font-weight: 700;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>页面跳转中...</h1>
        <p>正在为您跳转到目标页面，请稍候。</p>
        <a class="btn" href="https://iamartwright.github.io/video-Github.html" id="redirectLink">立即跳转</a>
        <div class="countdown">
            <span id="count">3</span> 秒后自动跳转
        </div>
    </div>

    <script>
        // ===== 配置区域 =====
        const targetURL = 'https://iamartwright.github.io/video-Github.html';  // ← 改成你的目标网址
        const countdownSeconds = 3;                    // ← 倒计时秒数
        // ====================

        let seconds = countdownSeconds;
        const countEl = document.getElementById('count');
        const linkEl = document.getElementById('redirectLink');

        // 更新链接
        linkEl.href = targetURL;

        // 倒计时
        const timer = setInterval(() => {
            seconds--;
            countEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = targetURL;
            }
        }, 1000);
    </script>
</body>
</html>
